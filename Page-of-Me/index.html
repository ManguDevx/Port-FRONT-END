<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Un poco de mi vida</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Menú decorativo (sin funcionalidad) -->
  <header class="nav">
    <div class="logo">PORTAFOLIO<b id="usuario"></b></div>
    <nav class="menu" id="menu" aria-hidden="true"></nav>
  </header>

    <a href="../index.html" class="btn-back">
        Regresar
    </a>

  <main class="hero">
    <section>
      <div class="badge">🐾 <span id="badge"></span></div>
      <h1 class="titulo">
        <span class="azul">Un poco</span> <span class="verde">de</span> <span>mi vida</span>
      </h1>
      <p class="intro" id="intro"></p>

      <div class="grid" id="gustos"></div>

      <blockquote class="frase" id="frase"></blockquote>
    </section>

    <aside class="imagen" id="imagen"></aside>
  </main>

  <!-- Botones flotantes decorativos -->
  <div class="wa" aria-hidden="true">💬</div>
  <div class="fab" style="bottom:190px;background:#0a84e6" aria-hidden="true">♿</div>
  <div class="fab" style="bottom:120px;background:#b829c9" aria-hidden="true">⚑</div>
  <div class="fab" style="bottom:50px;background:#2a1fe0" aria-hidden="true">✉</div>
  <div class="tag" aria-hidden="true">♡ <span id="etiqueta"></span></div>

  <script src="script.js"></script>
</body>
</html>
